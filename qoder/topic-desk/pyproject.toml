[project]
name = "topic-desk"
version = "0.1.0"
description = "课题续研台：基于 PowerContext 的跨会话研究课题交接与续研工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "powercontext[cli,server]>=1.4.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
